name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: pages
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 2s --health-retries 30
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: test
          MYSQL_DATABASE: pages
        ports: ["3306:3306"]
        options: --health-cmd "mysqladmin ping -h 127.0.0.1 -ptest" --health-interval 2s --health-retries 60
      mongo:
        image: mongo:8
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping:1})'"
          --health-interval 2s --health-retries 30
    env:
      PAGES_PG_URL: postgres://postgres:test@localhost:5432/pages
      PAGES_MYSQL_URL: mysql://root:test@localhost:3306/pages
      PAGES_MONGO_URL: mongodb://localhost:27017
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npx vitest run --coverage.enabled --coverage.reporter=text-summary
      - run: npm pack --dry-run
